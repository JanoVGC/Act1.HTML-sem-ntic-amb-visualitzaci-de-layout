<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre d'usuari</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="register-page">
    <nav class="register-nav" aria-label="Navegació principal">
        <a class="register-avatar" href="perfil.html" aria-label="Obre el perfil">JA</a>
        <ul>
            <li><a href="login.html">Login</a></li>
            <li><a href="index.html">Inici</a></li>
        </ul>
    </nav>

    <main class="register-main">
        <section class="register-section">
            <h1>Registra't</h1>
            <p class="register-intro">Crea el teu compte per començar.</p>
            <form class="register-form" action="registre.php" method="POST">
                <label for="register-username">Nom d'usuari:</label>
                <input type="text" id="register-username" name="username" required>

                <label for="register-email">Correu electrònic:</label>
                <input type="email" id="register-email" name="email" required>

                <label for="register-password">Contrasenya:</label>
                <input type="password" id="register-password" name="password" required>

                <label class="register-remember" for="register-remember">
                    <input type="checkbox" id="register-remember" name="remember">
                    Recorda la contrasenya
                </label>

                <input class="register-submit" type="submit" value="Registrar-se">
            </form>
        </section>

        <div class="register-side-content">
            <aside class="register-aside">
                <h2>Informació addicional</h2>
                <p>El registre et permetrà guardar les teves preferències.</p>
            </aside>

            <article class="register-article">
                <h2>Notícies i actualitzacions</h2>
                <p>Consulta les novetats del nostre lloc web.</p>
            </article>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 El teu lloc web. Tots els drets reservats.</p>
    </footer>
</body>
</html>
