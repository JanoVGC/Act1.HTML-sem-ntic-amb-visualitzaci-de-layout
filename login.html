<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <nav class="login-nav" aria-label="Navegació principal">
        <a class="login-avatar" href="perfil.html" aria-label="Obre el perfil">JA</a>
        <a href="registre.html">Registre</a>
        <ul>
            <li><a href="index.html">Inici</a></li>
            <li><a href="perfil.html">Perfil</a></li>
        </ul>
    </nav>
    <main class="login-main">
        <section class="login-section">
            <div class="large-avatar" aria-label="Avatar de l'usuari">JA</div>
            <h1>Inicia sessió</h1>
            <form class="login-form" action="login.php" method="POST">
                <label for="username">Nom d'usuari:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Contrasenya:</label>
                <input type="password" id="password" name="password" required>

                <label class="remember-option" for="remember">
                    <input type="checkbox" id="remember" name="remember">
                    Recorda la contrasenya
                </label>

                <input class="login-submit" type="submit" value="Iniciar sessió">
            </form>
        </section>

        <div class="login-side-content">
            <aside class="login-aside">
                <h2>Informació addicional</h2>
                <p>Consulta les opcions disponibles del teu compte.</p>
            </aside>

            <article class="login-article">
                <h2>Notícies i actualitzacions</h2>
                <p>Descobreix les novetats més recents del nostre lloc web.</p>
            </article>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 El teu lloc web. Tots els drets reservats.</p>
    </footer>




</body>
</html>
